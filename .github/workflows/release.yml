name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build web application
        working-directory: web
        shell: pwsh
        run: |
          npm install --ignore-scripts
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python packaging dependencies
        shell: pwsh
        run: python -m pip install -r backend/requirements.txt pyinstaller

      - name: Build portable application
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean packaging/industry_atlas.spec

      - name: Smoke test packaged application
        shell: pwsh
        run: |
          $env:INDUSTRY_ATLAS_NO_BROWSER = '1'
          $process = Start-Process .\dist\IndustryAtlas\IndustryAtlas.exe -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt += 1) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod http://127.0.0.1:8000/api/health -TimeoutSec 2
                if ($health.status -eq 'ok') { $ready = $true; break }
              } catch {}
            }
            if (-not $ready) { throw 'Packaged application did not become ready.' }
            $page = Invoke-WebRequest http://127.0.0.1:8000 -UseBasicParsing -TimeoutSec 5
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch 'id="root"') { throw 'Packaged web UI is unavailable.' }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '${{ inputs.version }}' }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DMyAppVersion=$version" packaging\IndustryAtlas.iss
          Get-FileHash packaging\output\*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content packaging\output\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: IndustryAtlas-Windows
          path: |
            packaging/output/*.exe
            packaging/output/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' packaging/output/*.exe packaging/output/SHA256SUMS.txt --title "Industry Atlas ${{ github.ref_name }}" --notes "Windows 本地安装版。数据保存在每位用户自己的电脑；DeepSeek API Key 由用户在系统设置中填写。"
